[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bt-apokalypse"
version = "0.1.0"
description = "A self-hosted BitTorrent client with a web interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "libtorrent>=2.0.11,<3",
  "Pillow>=10,<13",
  "pystray>=0.19,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pyinstaller>=6.16,<7", "pytest>=8,<10"]

[project.scripts]
apokalypse = "apokalypse.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/apokalypse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
